trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: drp-secrets # Importa JFROG_TOKEN de Azure DevOps
  - name: JFROG_REPO
    value: 'drp-artifacts'
  - name: AWS_REGION
    value: 'us-east-1'

stages:
- stage: Build_and_Publish
  displayName: 'Construir y Subir a JFrog'
  jobs:
  - job: BuildLambda
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        architecture: 'x64'

    - script: |
        pip install -r src/requirements.txt -t ./package
        cd package
        zip -r ../drp-redis-flush.zip .
        cd ..
        zip -g drp-redis-flush.zip src/lambda_function.py
      displayName: 'Empaquetar dependencias y código en ZIP'

    - task: JFrogGenericArtifacts@1
      displayName: 'Subir artefacto a JFrog'
      inputs:
        command: 'Upload'
        connection: 'jfrog-drp-connection'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "drp-redis-flush.zip",
                "target": "$(JFROG_REPO)/lambda/drp-redis-flush/$(Build.BuildId)/drp-redis-flush.zip"
              }
            ]
          }
        collectBuildInfo: true
        buildName: '$(Build.DefinitionName)'
        buildNumber: '$(Build.BuildId)'

- stage: Deploy_Dev_Virginia
  displayName: 'Desplegar AWS (Dev Virginia)'
  dependsOn: Build_and_Publish
  condition: succeeded()
  jobs:
  - job: TerraformApply
    variables:
      TF_VAR_build_number: '$(Build.BuildId)'
      TF_VAR_environment: 'DEV'
      TF_VAR_redis_endpoint: 'prueba-zzsueq.serverless.use1.cache.amazonaws.com'
      TF_VAR_lambda_execution_role_arn: 'arn:aws:elasticache:us-east-1:537650461158:serverlesscache:prueba' # Reemplaza TU_CUENTA_AWS con tu ID de cuenta
      TF_VAR_lambda_security_group_id: 'sg-0d3459c7932d9e84b'
      TF_VAR_private_subnet_ids: '["subnet-084f5211209b6d055", "subnet-00496c3f21802676c", "subnet-0c9aa04262f52e1d7"]' 
    steps:
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: 'Instalar Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'aws'
        command: 'init'
        workingDirectory: 'infra'
        backendServiceAWS: 'aws-virginia-dev-tf' # <-- El nuevo nombre de tu conexión
        backendAWSBucketName: 'tfstate-drp-automatization-devops' # Cambia por tu bucket real
        backendAWSKey: 'virginia/dev/redis-lambda.tfstate'
        backendAWSRegion: 'us-east-1'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform Apply'
      env:
        TF_VAR_jfrog_token: $(JFROG_TOKEN) # Inyecta el secreto de JFrog
      inputs:
        provider: 'aws'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAWS: 'aws-virginia-dev-tf' # <-- El nuevo nombre de tu conexión
        commandOptions: '-auto-approve'