trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: drp-secrets # Importa JFROG_TOKEN de Azure DevOps
  - name: JFROG_REPO
    value: 'drp-artifacts'
  # Nuevo flag: false despliega en us-east-1, true despliega en ca-central-1
  - name: ENABLE_CANADA_DRP
    value: 'false' 

stages:
- stage: Build_and_Publish
  displayName: 'Construir y Subir a JFrog'
  jobs:
  - job: BuildLambda
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        architecture: 'x64'

    - script: |
        pip install -r src/requirements.txt -t ./package
        cd package
        zip -r ../drp-redis-flush.zip .
        cd ..
        cd src
        zip -g ../drp-redis-flush.zip lambda_function.py
        cd ..
      displayName: 'Empaquetar dependencias y código en ZIP'

    - task: JFrogGenericArtifacts@1
      displayName: 'Subir artefacto a JFrog'
      inputs:
        command: 'Upload'
        connection: 'jfrog-drp-connection'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "drp-redis-flush.zip",
                "target": "$(JFROG_REPO)/lambda/drp-redis-flush/$(Build.BuildId)/drp-redis-flush.zip"
              }
            ]
          }
        collectBuildInfo: true
        buildName: '$(Build.DefinitionName)'
        buildNumber: '$(Build.BuildId)'

- stage: Deploy_AWS
  displayName: 'Desplegar AWS (Multi-Región)'
  dependsOn: Build_and_Publish
  condition: succeeded()
  jobs:
  - job: TerraformApply
    steps:
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
      displayName: 'Instalar Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: JFrogGenericArtifacts@1
      displayName: 'Descargar ZIP desde JFrog'
      inputs:
        command: 'Download'
        connection: 'jfrog-drp-connection'
        specSource: 'taskConfiguration'
        fileSpec: |
          {
            "files": [
              {
                "pattern": "$(JFROG_REPO)/lambda/drp-redis-flush/$(Build.BuildId)/drp-redis-flush.zip",
                "target": "infra/",
                "flat": "true"
              }
            ]
          }

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'aws'
        command: 'init'
        workingDirectory: 'infra'
        backendServiceAWS: 'aws-virginia-dev-tf'
        backendAWSBucketName: 'tfstate-drp-automatization-devops'
        backendAWSKey: 'virginia/dev/redis-lambda.tfstate'
        backendAWSRegion: 'us-east-1' # Mantiene el .tfstate centralizado en Virginia

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV4@4
      displayName: 'Terraform Apply'
      env:
        # Pasa el valor de Azure DevOps a la variable enable_canada_drp de Terraform
        TF_VAR_enable_canada_drp: '$(ENABLE_CANADA_DRP)'
        
        TF_VAR_environment: 'DEV'
        TF_VAR_redis_endpoint: 'rediss://prueba-zzsueq.serverless.use1.cache.amazonaws.com:6379'
        TF_VAR_lambda_execution_role_arn: 'arn:aws:iam::537650461158:role/DRP-Redis-Lambda-Role'
        TF_VAR_lambda_security_group_id: 'sg-0d3459c7932d9e84b'
        TF_VAR_private_subnet_ids: '["subnet-084f5211209b6d055", "subnet-00496c3f21802676c", "subnet-0c9aa04262f52e1d7"]'
      inputs:
        provider: 'aws'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAWS: 'aws-virginia-dev-tf'
        commandOptions: '-auto-approve'